<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="arrgrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="1039" height="299" rx="14" fill="#ffffff" stroke="#d9dde3"/>

  <!-- title -->
  <text x="28" y="40" font-size="20" font-weight="700" fill="#111827"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">private/*</tspan> models</text>
  <text x="28" y="64" font-size="14" fill="#4b5563">The model itself runs inside the enclave. Only you and the enclave ever see your prompt.</text>

  <!-- encrypted zone band -->
  <rect x="236" y="96" width="600" height="150" rx="10" fill="#eaf7f0" stroke="#bfe6d0" stroke-dasharray="6 5"/>
  <text x="536" y="118" font-size="12" font-weight="600" fill="#1f7a4d" text-anchor="middle">HPKE-ENCRYPTED — CIPHERTEXT ONLY, END TO END</text>

  <!-- box: your app -->
  <rect x="28" y="140" width="130" height="72" rx="10" fill="#f3f4f6" stroke="#cfd4db"/>
  <text x="93" y="170" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Your app</text>
  <text x="93" y="192" font-size="12" fill="#6b7280" text-anchor="middle">curl · SDK · Claude Code</text>

  <!-- arrow app -> proxy -->
  <line x1="158" y1="176" x2="196" y2="176" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrgrey)"/>

  <!-- box: proxy (straddles zone edge) -->
  <rect x="200" y="132" width="170" height="88" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/>
  <text x="285" y="158" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Proxy</text>
  <text x="285" y="177" font-size="12" fill="#374151" text-anchor="middle">on your machine</text>
  <text x="285" y="196" font-size="12" fill="#1f7a4d" text-anchor="middle">verifies · encrypts 🔒</text>

  <!-- arrow proxy -> ppq -->
  <line x1="370" y1="176" x2="452" y2="176" stroke="#1f7a4d" stroke-width="3" marker-end="url(#arr)"/>

  <!-- box: PPQ.AI -->
  <rect x="456" y="132" width="160" height="88" rx="10" fill="#ffffff" stroke="#cfd4db"/>
  <text x="536" y="158" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">PPQ.AI</text>
  <text x="536" y="177" font-size="12" fill="#374151" text-anchor="middle">relays ciphertext</text>
  <text x="536" y="196" font-size="12" fill="#374151" text-anchor="middle">bills your key</text>

  <!-- arrow ppq -> enclave -->
  <line x1="616" y1="176" x2="668" y2="176" stroke="#1f7a4d" stroke-width="3" marker-end="url(#arr)"/>

  <!-- box: Tinfoil enclave -->
  <rect x="672" y="124" width="196" height="104" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="2"/>
  <text x="770" y="150" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Tinfoil enclave</text>
  <text x="770" y="168" font-size="11" fill="#374151" text-anchor="middle">AMD SEV-SNP</text>
  <text x="770" y="192" font-size="12" font-weight="600" fill="#1f7a4d" text-anchor="middle">decrypts · RUNS THE MODEL</text>
  <text x="770" y="210" font-size="12" fill="#374151" text-anchor="middle">encrypts the reply</text>

  <!-- legend: who can read -->
  <text x="28" y="272" font-size="13" fill="#111827"><tspan font-weight="700">Who can read your prompt:</tspan> you, and the model inside the enclave.</text>
  <text x="28" y="290" font-size="13" fill="#6b7280">Not PPQ.AI. Not Tinfoil's operators. Not the cloud it runs on.</text>

  <!-- right-side eye legend -->
  <text x="1012" y="272" font-size="13" fill="#1f7a4d" text-anchor="end" font-weight="600">🔒 plaintext exists only inside the enclave</text>
</svg>
