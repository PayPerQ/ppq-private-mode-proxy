<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="arramber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrgrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="1039" height="299" rx="14" fill="#ffffff" stroke="#d9dde3"/>

  <!-- title -->
  <text x="28" y="40" font-size="20" font-weight="700" fill="#111827">Path 2 — every other model (Claude, GPT, Gemini, Grok, …)</text>
  <text x="28" y="64" font-size="14" fill="#4b5563">PPQ's routing runs inside the enclave; the model's provider still sees your prompt. PPQ.AI does not.</text>

  <!-- encrypted zone band -->
  <rect x="220" y="96" width="470" height="150" rx="10" fill="#eaf7f0" stroke="#bfe6d0" stroke-dasharray="6 5"/>
  <text x="455" y="118" font-size="12" font-weight="600" fill="#1f7a4d" text-anchor="middle">HPKE-ENCRYPTED — PPQ.AI SEES CIPHERTEXT ONLY</text>

  <!-- plaintext zone band -->
  <rect x="700" y="96" width="316" height="150" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-dasharray="6 5"/>
  <text x="858" y="118" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">PLAINTEXT — THE PROVIDER SEES YOUR PROMPT</text>

  <!-- box: your app -->
  <rect x="28" y="140" width="120" height="72" rx="10" fill="#f3f4f6" stroke="#cfd4db"/>
  <text x="88" y="170" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Your app</text>
  <text x="88" y="192" font-size="12" fill="#6b7280" text-anchor="middle">curl · SDK · Claude Code</text>

  <line x1="148" y1="176" x2="182" y2="176" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrgrey)"/>

  <!-- box: proxy -->
  <rect x="186" y="132" width="150" height="88" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/>
  <text x="261" y="158" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Proxy</text>
  <text x="261" y="177" font-size="12" fill="#374151" text-anchor="middle">on your machine</text>
  <text x="261" y="196" font-size="12" fill="#1f7a4d" text-anchor="middle">verifies · encrypts 🔒</text>

  <line x1="336" y1="176" x2="392" y2="176" stroke="#1f7a4d" stroke-width="3" marker-end="url(#arr)"/>

  <!-- box: PPQ.AI -->
  <rect x="396" y="132" width="118" height="88" rx="10" fill="#ffffff" stroke="#cfd4db"/>
  <text x="455" y="158" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">PPQ.AI</text>
  <text x="455" y="177" font-size="12" fill="#374151" text-anchor="middle">forwards bytes</text>
  <text x="455" y="196" font-size="12" fill="#374151" text-anchor="middle">bills your key</text>

  <line x1="514" y1="176" x2="546" y2="176" stroke="#1f7a4d" stroke-width="3" marker-end="url(#arr)"/>

  <!-- box: Nitro enclave (straddles the two zones) -->
  <rect x="550" y="124" width="196" height="104" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="2"/>
  <text x="648" y="150" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">PPQ Nitro enclave</text>
  <text x="648" y="168" font-size="11" fill="#374151" text-anchor="middle">AWS Nitro · open source</text>
  <text x="648" y="192" font-size="12" font-weight="600" fill="#1f7a4d" text-anchor="middle">decrypts · picks the upstream</text>
  <text x="648" y="210" font-size="12" fill="#374151" text-anchor="middle">holds the provider keys</text>

  <!-- TLS arrow to provider -->
  <line x1="746" y1="176" x2="828" y2="176" stroke="#b45309" stroke-width="3" marker-end="url(#arramber)"/>
  <text x="787" y="166" font-size="11" fill="#b45309" text-anchor="middle">TLS</text>

  <!-- box: provider -->
  <rect x="832" y="132" width="176" height="88" rx="10" fill="#ffedd5" stroke="#b45309" stroke-width="2"/>
  <text x="920" y="158" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Model provider</text>
  <text x="920" y="177" font-size="12" fill="#374151" text-anchor="middle">Anthropic · OpenAI · Google · …</text>
  <text x="920" y="196" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">👁 sees the plaintext</text>

  <!-- legend -->
  <text x="28" y="272" font-size="13" fill="#111827"><tspan font-weight="700">Who can read your prompt:</tspan> you, the enclave, and the model's provider — as if you had called them directly.</text>
  <text x="28" y="290" font-size="13" fill="#6b7280">What you gain: PPQ.AI, the company billing you, cannot. This is <tspan font-style="italic">not</tspan> end-to-end encryption to the model.</text>
</svg>
